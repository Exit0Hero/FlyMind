name: FlyMind CI

on:
  push:
    branches: [feature/*, release/*, docs/*]
  pull_request:
    branches: [main, develop]

jobs:
  fast-tests:
    name: Fast Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install streamlit

      - name: Run inference tests
        run: python -m pytest tests/test_inference.py -v --tb=short

      - name: Run production inference tests
        run: python -m pytest tests/test_production_inference.py -v --tb=short

      - name: Run dashboard tests
        run: python -m pytest tests/test_dashboard.py -v --tb=short

      - name: Run experiment tests
        run: python -m pytest tests/test_experiment_2d.py tests/test_experiment_3.py -v --tb=short

      - name: Run data integrity tests
        run: python -m pytest tests/test_data_integrity.py -v --tb=short

      - name: Run pipeline tests
        run: python -m pytest tests/test_pipeline.py -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flymind:ci-test .

      - name: Verify container starts
        run: |
          docker run -d --name flymind-test -p 8501:8501 flymind:ci-test
          sleep 10
          docker logs flymind-test
          docker stop flymind-test
          docker rm flymind-test
