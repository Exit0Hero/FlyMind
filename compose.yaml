# FlyMind deployable stack (Phase 16).
#
# Philosophy (documented in docs/DEPLOYMENT.md)
#   * No infrastructure is created or managed here: no database, cache, queue or
#     message broker. Data and model artifacts live on the host and are mounted
#     read-only; the API container never writes to them, and the model is a
#     503-gated runtime dependency, not a baked image layer.
#   * Two services only — `frontend` (Next.js) and `backend` (FastAPI). The
#     frontend proxies /api/* to the backend via rewrites so the browser never
#     holds backend credentials and there is exactly one public origin.
#   * The backend stays behind the frontend for external traffic; only the
#     frontend port is published to the host.
#
# Quick start (see docs/DEPLOYMENT.md for full walkthrough incl. checkout,
# env, model placement and rollout/rollback):
#   cp .env.example .env                # provide required secrets/paths
#   docker compose up -d --build
#   open http://localhost:3000          # frontend
#   docker compose ps                   # look for "healthy" columns
#
# The frontend depends_on the backend with a *healthy* gate: it waits until the
# FastAPI service is live (/api/health == 200) before starting. The stricter,
# model-aware readiness probe (/api/ready, 503 until the artifact is loaded and
# verified) is exposed to orchestrators and CI; the container's own
# HEALTHCHECK uses /api/health as the compose gate so the stack can come up
# even before a model artifact is mounted.

name: flymind

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: flymind-backend:${FLYMIND_DOCKER_TAG:-local}
    restart: unless-stopped
    environment:
      # APP_* is a static contract; MODEL_VERSION stays glued to the artifact.
      FLYMIND_APP_VERSION: ${FLYMIND_APP_VERSION:-1.0.0}
      FLYMIND_API_VERSION: ${FLYMIND_API_VERSION:-1.0.0}
      FLYMIND_MODEL_VERSION: ${FLYMIND_MODEL_VERSION:-FlyMind-RF v1.0.0}
      FLYMIND_ENV: ${FLYMIND_ENV:-production}
      FLYMIND_DEBUG: ${FLYMIND_DEBUG:-false}
      FLYMIND_LOG_LEVEL: ${FLYMIND_LOG_LEVEL:-info}
      FLYMIND_PORT: ${FLYMIND_PORT:-8001}
      FLYMIND_HOST: ${FLYMIND_HOST:-0.0.0.0}
      FLYMIND_CORS_ORIGINS: ${FLYMIND_CORS_ORIGINS:?CORS_ORIGINS required in .env}
      FLYMIND_API_PREFIX: /api
      # uvicorn binds ${PORT}; keep it aligned with FLYMIND_PORT so the
      # healthcheck and the published port match the actual listener.
      PORT: ${FLYMIND_PORT:-8001}
      # Mounted artifact locations (host paths configured via MODELS_DIR/DATA_DIR).
      FLYMIND_MODELS_DIR: /flymind/models
      FLYMIND_DATA_DIR: /flymind/data
      FLYMIND_RESULTS_DIR: /flymind/results
    # Model + data are read-only host bind mounts; nothing is baked into the
    # image and nothing is committed to the repo.
    volumes:
      - ${MODELS_DIR:-./models}:/flymind/models:ro
      - ${DATA_DIR:-./data}:/flymind/data:ro
      - ${RESULTS_DIR:-./results}:/flymind/results
    ports:
      - "127.0.0.1:8001:8001"
    # Compose gate uses /api/health (live), documented as distinct from the
    # model-aware /api/ready (ready) probe used by orchestrators/CI.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        BACKEND_URL: http://backend:8001
    image: flymind-frontend:${FLYMIND_DOCKER_TAG:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8001
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    healthcheck:
      # Same as the probe baked into the image; declared here too so `compose
      # ps` reports real frontend health through the /api proxy hop.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  default:
    name: flymind
