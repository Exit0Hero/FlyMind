# FlyMind continuous integration — app-level checks (Phase 16/17).
#
# Replaces the legacy Streamlit-era `ci.yml` (impossible on a clean runner:
# no pytest install, Docker job needed git-ignored parquet/pkl). Runs only on
# the production components that Phase 16/17 ships and never touches the
# experiments, the model artifact or the dataset:
#   * Backend: fixture-only tests using the stub ML service (no artifact, no
#     network dataset fetch). Runtime + dev deps installed from committed
#     requirements files.
#   * Frontend: ESLint + type-check (tsc --noEmit) + production build.
#   * Live smoke against the *started* FastAPI app: /api/health, /api/version
#     and /api/ready contracts via TestClient (ready is 503 without artifact).
#   * Docker: both production images build from the committed Dockerfiles.
#
# Secrets/artifacts policy: CI has no access to .env, models/, data/ or
# experiments/. Health gates use /api/health (liveness); /api/ready is asserted
# to return 503 exactly when the (absent) artifact is not loaded, proving the
# readiness contract without needing the model on the runner.

name: app-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "release/**"]
  workflow_dispatch:

env:
  # Backend must match the Docker base image (python:3.11-slim) so CI reflects
  # what ships in the container, not just the dev machine.
  PYTHON_VERSION: "3.11"
  PYTHONPATH: backend

jobs:
  backend-ci:
    name: Backend (install · lint · test)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Run backend test suite (fixture-only, no dataset/model)
        run: python -m pytest tests -q

  frontend-ci:
    name: Frontend (lint · type-check · build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          BACKEND_URL: http://backend:8001

  api-contract:
    name: Live API smoke (health · version · ready)
    runs-on: ubuntu-22.04
    needs: backend-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Probe the served HTTP API
        run: python scripts/smoke_api.py

  docker-build:
    name: Docker build (backend · frontend)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (repo-root context)
        run: docker build -f backend/Dockerfile -t flymind-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t flymind-frontend:ci frontend
